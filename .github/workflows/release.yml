name: Release Please

on:
  workflow_call:
    inputs:
      release-type:
        description: release-please release type
        type: string
        default: python

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          release-type: ${{ inputs.release-type }}
